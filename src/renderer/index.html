<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
      }

      .antd-spin {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        color: #1677ff;
        vertical-align: middle;
        text-align: center;
        list-style: none;
      }

      .dot-item {
        width: 10px;
        height: 10px;
        background-color: #1677ff;
        border-radius: 100%;
        display: inline-block;
        animation: antdSpinMove 1s infinite linear alternate;
        opacity: 0.3;
      }

      @keyframes antdSpinMove {
        to {
          opacity: 1;
        }
      }
    </style>
  </head>

  <body>
    <div id="loading-screen">
      <div class="antd-spin">
        <div class="dot-item"></div>
        <div class="dot-item" style="animation-delay: 0.2s"></div>
        <div class="dot-item" style="animation-delay: 0.4s"></div>
        <p style="color: rgba(0, 0, 0, 0.45); font-size: 14px">Загрузка...</p>
      </div>
    </div>

    <div id="root"></div>

    <style>
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f5f5f5;
        z-index: 9999;
        transition:
          opacity 0.5s ease-out,
          visibility 0.5s;
      }

      #loading-screen.fade-out {
        opacity: 0;
        visibility: hidden;
      }

      .antd-spin {
        text-align: center;
      }
      .dot-item {
        width: 10px;
        height: 10px;
        margin: 2px;
        background-color: #1677ff;
        border-radius: 100%;
        display: inline-block;
        animation: antdSpinMove 1s infinite linear alternate;
        opacity: 0.3;
      }
      @keyframes antdSpinMove {
        to {
          opacity: 1;
        }
      }
    </style>

    <script type="module" src="./main.tsx"></script>
  </body>
</html>
